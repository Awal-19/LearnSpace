name: learnspace

# Local development stack. Copy .env.example to .env first (JWT_SECRET is required).
#   docker compose up -d db mailpit     -> only infrastructure (run apps with npm run dev)
#   docker compose up --build           -> everything in containers

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnspace}
      POSTGRES_DB: ${POSTGRES_DB:-learnspace}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI: http://localhost:8025

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnspace}:${POSTGRES_PASSWORD:-learnspace}@db:5432/${POSTGRES_DB:-learnspace}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      CLIENT_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: no-reply@learnspace.local
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '4000:4000'
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    depends_on:
      - server
    environment:
      VITE_PROXY_TARGET: http://server:4000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      - ./client/index.html:/app/client/index.html

volumes:
  db-data:
